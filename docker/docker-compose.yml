# RailGati — Local Development Services
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down
#
# PostgreSQL credentials match .env.example defaults.
# Override via environment variables if needed.

services:
  postgres:
    image: postgres:16-alpine
    container_name: railgati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railgati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railgati_dev}
      POSTGRES_DB: ${POSTGRES_DB:-railgati}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - railgati_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railgati}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  railgati_pgdata:
    name: railgati_pgdata
